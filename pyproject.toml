[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tag-manager-mcp"
version = "0.1.0"
description = "Internal Python MCP server for Google Tag Manager"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "google-api-python-client>=2.160.0",
  "google-auth>=2.38.0",
  "google-auth-oauthlib>=1.2.1",
  "mcp>=1.12.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-cov>=6.0.0", "ruff>=0.9.0"]

[project.scripts]
tag-manager-mcp = "tag_manager_mcp.server:main"
tag-manager-auth = "tag_manager_mcp.auth_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tag_manager_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
